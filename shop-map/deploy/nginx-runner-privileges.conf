# Example nginx site for the Runner Privileges map.
# 1. Copy the runner-privileges/ folder to /var/www/runner-privileges
# 2. Replace shop.teambase.work with your domain, put this file in /etc/nginx/sites-available/, enable it, then:
#    sudo nginx -t && sudo systemctl reload nginx
# 3. Add HTTPS (needed for "My location" on phones):  sudo certbot --nginx -d shop.teambase.work
server {
    listen 80;
    server_name shop.teambase.work;
    root /var/www/runner-privileges;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / { try_files $uri $uri/ =404; }

    # logos, icons and the map library rarely change: cache them for a week
    location ~* \.(webp|png|jpg|svg|css|js)$ { expires 7d; add_header Cache-Control "public"; }
    # shop data changes when the sheet is rebuilt: always revalidate
    location /data/ { add_header Cache-Control "no-cache"; }
}
